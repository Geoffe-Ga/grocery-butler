name: CI

# Every job here is a thin wrapper around the same scripts developers run
# locally, with the same pinned tools (requirements-dev.txt). Rules live in
# pyproject.toml and scripts/, never in this file, so CI and a laptop can't
# disagree.
#
# Every job sets timeout-minutes so a hung job costs minutes, not GitHub's
# six-hour default. tests/test_workflows.py holds every workflow to it.

# No push trigger: a merge to main starts no run. A PR's own CI tests what
# lands, and the nightly full run is the backstop for skew between merges.
# tests/test_ci_triggers.py holds it.
on:
  pull_request:
    branches: [main]
  # 14:17 UTC (06:17 Pacific). Not :00 or :30, where GitHub delays and, under
  # load, drops scheduled runs.
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

# One run per event and ref, so a PR's newer push cancels its older run. A
# nightly run and a dispatch both run on refs/heads/main; the event keeps them
# apart, so neither cancels the other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Measured on 2026-11-26 with 2,785 tests: 7.5 min on one version, and two
    # others were cancelled at the old 10 min limit with the second test pass
    # 82% done, so a run needs about 11 min. check-all runs the tests twice
    # (the unit lane, then everything under coverage), which is most of it.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: grocery_test
          POSTGRES_PASSWORD: grocery_test
          POSTGRES_DB: grocery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U grocery_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: ./scripts/check-all.sh
        env:
          # The throwaway database the Postgres service above creates; the
          # Postgres-only tests skip without it.
          TEST_DATABASE_URL: postgresql://grocery_test:grocery_test@localhost:5432/grocery_test
        run: ./scripts/check-all.sh

  pre-commit:
    name: Pre-commit hooks (changed files)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: pre-commit on changed files
        env:
          # The branch guard protects local commits; a nightly or manual run checks out main.
          SKIP: no-commit-to-branch
          # Only a PR diffs against a base; other runs check every file. An empty
          # BASE_REF, or one that isn't fetched, also makes precommit-changed.sh
          # check every file (tests/test_scripts.py holds it to that).
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          FULL: ${{ github.event_name != 'pull_request' }}
        run: ./scripts/precommit-changed.sh --show-diff-on-failure

  gate:
    name: CI gate
    # The one check to require in branch protection. It fails if any job it
    # needs failed or was cancelled.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [python, pre-commit]
    if: always()
    steps:
      - name: All required jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) echo "::error::A required job ended: $r"; exit 1 ;; esac
          done

  mutation:
    name: Mutation testing (manual, before a release)
    # Recommended before a release, not a merge gate.
    # Run from the Actions tab: "Run workflow" on main. Never nightly.
    runs-on: ubuntu-latest
    timeout-minutes: 360  # no run measured yet: the hosted-runner maximum, set on purpose
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: ./scripts/mutation.sh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          ./scripts/mutation.sh
