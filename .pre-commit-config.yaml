# Pre-commit hooks for grocery-butler
# Install: pre-commit install --install-hooks -t pre-commit -t commit-msg
# Run manually (with .venv active): ./scripts/precommit-changed.sh
# (changed files, exactly as CI does; it checks every file when this config changes)
#
# One set of rules everywhere: hooks that run a project tool are `local` hooks
# calling the exact versions pinned in requirements-dev.txt, with config from
# pyproject.toml. CI runs this file too (the `pre-commit` job), alongside
# ./scripts/check-all.sh. Don't add a second copy of a tool here.

default_language_version:
  python: python3

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    # Two trailing spaces are a hard line break in Markdown; keep them.
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: check-yaml
  - id: check-toml
  - id: check-json
  - id: check-added-large-files
    args: [--maxkb=500]
  - id: check-case-conflict
  - id: check-merge-conflict
  - id: check-symlinks
  - id: check-ast
  - id: debug-statements
  - id: check-docstring-first
  - id: detect-private-key
  - id: fix-byte-order-marker
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: no-commit-to-branch
    args: [--branch, main]

- repo: local
  hooks:
  # --fix applies Ruff's safe fixes locally. In CI a fix still fails the hook,
  # because pre-commit fails any hook that changes a file.
  - id: ruff-lint
    name: ruff (lint, pinned)
    entry: ruff check --fix
    language: system
    types_or: [python, pyi]
  - id: ruff-format
    name: ruff (format, pinned)
    entry: ruff format
    language: system
    types_or: [python, pyi]
  - id: mypy
    name: mypy (pinned; scope from scripts/typecheck.sh)
    entry: ./scripts/typecheck.sh
    language: system
    pass_filenames: false
    types: [python]
  - id: interrogate
    name: interrogate (docstring coverage, pinned; config in pyproject.toml)
    entry: interrogate -c pyproject.toml
    language: system
    pass_filenames: false
    types: [python]
  - id: bandit
    name: bandit (pinned; config in pyproject.toml)
    entry: bandit -c pyproject.toml -q
    language: system
    types: [python]
    exclude: ^tests/

# Dead-code check: no pinned copy elsewhere, so it runs at this one version.
# tryceratops and refurb aren't separate hooks: Ruff's TRY and FURB rules
# (pyproject.toml) cover them, at the version requirements-dev.txt pins.
- repo: https://github.com/jendrikseipp/vulture
  rev: v2.16
  hooks:
  - id: vulture
    args: [grocery_butler/, --min-confidence, '80']

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck

- repo: https://github.com/Yelp/detect-secrets
  rev: v1.5.0
  hooks:
  - id: detect-secrets
    args: [--baseline, .secrets.baseline]

- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.3.0
  hooks:
  - id: conventional-pre-commit
    stages: [commit-msg]
